[package]
name = "arnes"
version = "0.0.1"
edition = "2024"
description = "Inspection and deployment of coding-agent configuration."
license-file = "LICENSE"
repository = "https://github.com/SebastienElet/arnes"
readme = "README.md"
keywords = ["agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "forbid"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -2 }
nursery = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
integer_division = "deny"
wildcard_enum_match_arm = "deny"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs", "process", "stdio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_path_to_error = "=0.1.20"
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
toml = "=1.1.8"
tiktoken-rs = "=0.12.1"

[dev-dependencies]

[profile.dev.package.tiktoken-rs]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.bstr]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3
