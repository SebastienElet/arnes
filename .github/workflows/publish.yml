name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Verify repository version and npm availability
        id: version
        run: |
          bun - <<'BUN'
          import { appendFileSync } from "node:fs";
          const manifest = await Bun.file("package.json").json();
          const version = manifest.version;
          if (typeof version !== "string" || !version || version.includes("\n")) {
            throw new Error("package.json must declare a version");
          }
          const cargo = Bun.TOML.parse(await Bun.file("Cargo.toml").text());
          if (cargo.package.version !== version) throw new Error("Cargo.toml version differs from package.json");
          const packages = [...new Bun.Glob("packages/*/package.json").scanSync(".")];
          const dependencies = new Map(Object.entries(manifest.optionalDependencies));
          if (!packages.length || packages.length !== dependencies.size) {
            throw new Error("Platform packages and optionalDependencies differ");
          }
          for (const path of packages) {
            const platform = await Bun.file(path).json();
            if (platform.version !== version || dependencies.get(platform.name) !== version) {
              throw new Error(`${path} or its optionalDependency differs from ${version}`);
            }
            dependencies.delete(platform.name);
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${encodeURIComponent(version)}`, {
            signal: AbortSignal.timeout(30000),
            redirect: "error",
          });
          if (response.ok) throw new Error(`${manifest.name}@${version} is already published`);
          if (response.status !== 404) throw new Error(`Cannot check npm availability: HTTP ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          BUN
  native:
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    strategy:
      matrix:
        include:
          - os: macos-26
            variant: darwin-arm64
          - os: ubuntu-24.04
            variant: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo test --all-features --locked
      - run: bun run build
      - run: bun test tests/launcher.test.mjs
      - run: bun pm pack --ignore-scripts --destination ../../dist
        working-directory: packages/${{ matrix.variant }}
      - run: |
          package="@sebastienelet/arnes-${{ matrix.variant }}"
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/${package/\//%2F}/$VERSION")
          case "$status" in
            200) echo "$package@$VERSION already published; skipping publication." ;;
            404) npm publish "./dist/sebastienelet-arnes-${{ matrix.variant }}-$VERSION.tgz" --provenance --access public --registry https://registry.npmjs.org --ignore-scripts --loglevel verbose ;;
            *) echo "Cannot check $package@$VERSION: HTTP $status" >&2; exit 1 ;;
          esac
  entry:
    needs: [verify, native]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: bun pm pack --ignore-scripts --destination dist
      - run: |
          npm publish "./dist/sebastienelet-arnes-$VERSION.tgz" --provenance --access public --registry https://registry.npmjs.org --ignore-scripts --loglevel verbose
